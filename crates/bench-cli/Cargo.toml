[package]
name = "reforge-bench"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Local inspection commands for Reforge Bench"
include = ["src/**", "schemas/**", "examples/**", "tests/**", "Cargo.toml", "LICENSE"]
publish = false

[lints]
workspace = true

[dependencies]
reforge-bench-core = { path = "../bench-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
