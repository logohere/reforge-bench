[workspace]
resolver = "3"
members = ["crates/bench-core", "crates/bench-cli", "experiments/rune/crates/cnc-ui-rune", "experiments/rune/apps/macos"]
default-members = ["crates/bench-cli"]

[workspace.package]
version = "0.1.0-alpha.1"
license = "MIT"
repository = "https://github.com/logohere/reforge-bench"
rust-version = "1.100.0"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "110490c008b673f0efdbcbf1d99bdf7ba9c03f2b", default-features = false, features = ["accessibility", "embedded-fonts", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "110490c008b673f0efdbcbf1d99bdf7ba9c03f2b" }
rea-ui-contract = { package = "reforge-bench-core", path = "crates/bench-core" }
rea-rune-ui = { package = "reforge-rune-ui", path = "experiments/rune/crates/cnc-ui-rune" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "=0.11.1"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
