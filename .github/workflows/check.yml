name: Check

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run model:check
      - run: npm exec --yes --package=bun@1.3.14 -- bun install --cwd web --frozen-lockfile --ignore-scripts
      - run: npm exec --yes --package=bun@1.3.14 -- bun audit --cwd web
      - run: npm exec --yes --package=bun@1.3.14 -- bun run --cwd web build
      - run: npm exec --yes --package=bun@1.3.14 -- bun test --cwd web
      - run: python3 scripts/check-distribution.py
      - run: cargo test --locked --workspace --all-features
      - run: cargo run --locked -- demo
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 scripts/package-macos.py
      - run: python3 scripts/package-source.py
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all --full-history" .'
      - run: '"$RUNNER_TEMP/gitleaks" dir --redact .'
